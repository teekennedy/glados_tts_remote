name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # The tag list behavior is as follows:
          #  - all images get tagged with their commit's short sha
          #  - pushes to main get tagged as main
          #  - PRs to main get tagged (but not published) as pr-<num>
          #  - New semver tags (e.g. vX.Y.Z) get tagged as:
          #    - vX (except for v0)
          #    - vX.Y
          #    - vX.Y.Z
          #    - latest
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix=

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/DeterminateSystems/magic-nix-cache-action
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: Build Docker Container
        run: nix build --accept-flake-config .#docker-cpu-http

      - name: Load, tag, and push (non-PR only)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker load < result
          for tag in $TAGS; do
            docker tag glados-tts:docker-cpu-http "$tag"
            docker push "$tag"
          done
