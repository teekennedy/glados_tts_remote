[project]
name = "glados-tts"
version = "0.1.0"
description = "Text-to-Speech synthesis package with GLaDOS and Kokoro voices"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "soundfile>=0.13.0",
    "numba>=0.61.0",
]

[project.optional-dependencies]
cuda = ["onnxruntime-gpu>=1.16.0"]
cpu = ["onnxruntime>=1.16.0"]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-requests",
]
downloader = [
    "httpx>=0.28.1",
    "rich>=14.1.0",
]
http = [
    "piper-tts[http]>=1.2.0",
    "flask>=2.3.0",
]

[project.scripts]
glados-tts = "glados_tts.cli:main"

# Build system
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ruff configuration
[tool.ruff]
line-length = 120
indent-width = 4

lint.extend-select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
]

target-version = "py312"

exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint.isort]
order-by-type = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
